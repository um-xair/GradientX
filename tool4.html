<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R4XN Dev Tools – Build Fast, Beautiful UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        .glass-effect {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .grid-pattern {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid-move 20s linear infinite;
        }

        @keyframes grid-move {
            0% { background-position: 0 0; }
            100% { background-position: 50px 50px; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        .hero-glow {
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.04) 0%, transparent 70%);
        }

        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .animate-pulse-slow {
            animation: pulse-slow 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-black text-white overflow-x-hidden">

<!-- Hero Section -->
<section class="relative min-h-screen flex items-center justify-center bg-black text-white overflow-hidden">
    <!-- Background Effects -->
    <div class="absolute inset-0 bg-gradient-to-b from-neutral-900 via-black to-neutral-950 opacity-90"></div>
    <div class="absolute inset-0 grid-pattern opacity-10"></div>
    <div class="absolute inset-0 hero-glow"></div>

    <!-- Floating Dots -->
    <div class="absolute top-20 left-10 w-4 h-4 bg-white/10 rounded-full animate-float"></div>
    <div class="absolute top-40 right-20 w-6 h-6 bg-white/10 rounded-full animate-float" style="animation-delay: 2s;"></div>
    <div class="absolute bottom-40 left-20 w-3 h-3 bg-white/10 rounded-full animate-float" style="animation-delay: 4s;"></div>
    <div class="absolute bottom-20 right-10 w-5 h-5 bg-white/10 rounded-full animate-float" style="animation-delay: 1s;"></div>

    <!-- Main Content -->
    <div class="relative z-10 max-w-6xl mx-auto px-6 text-center">
        <!-- Badge -->
        <div class="inline-flex items-center gap-2 glass-effect px-4 py-2 rounded-full text-sm font-medium mb-8 animate-pulse-slow text-gray-200">
            <span class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></span>
            No Setup Required. Use Instantly.
            <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
        </div>

        <!-- Heading -->
        <h1 class="text-5xl md:text-7xl font-bold mb-6 leading-tight">
            <span class="block">Build & Preview</span>
            <span class="block bg-gradient-to-r from-slate-300 via-gray-400 to-white bg-clip-text text-transparent">
                Beautiful UI Tools in Seconds
            </span>
        </h1>

        <!-- Subtitle -->
        <p class="text-lg md:text-2xl text-gray-400 max-w-3xl mx-auto mb-12">
            All-in-one developer utility suite — gradient generator, box shadow builder, and more.
        </p>

        <!-- CTA Buttons -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
            <button class="group relative px-8 py-4 bg-gradient-to-r from-gray-800 to-gray-900 rounded-full font-semibold text-lg hover:from-gray-700 hover:to-gray-800 transition-all duration-300 transform hover:scale-105">
                <span class="relative z-10">Explore Tools</span>
                <div class="absolute inset-0 bg-gradient-to-r from-white/10 to-white/5 rounded-full blur opacity-30 group-hover:opacity-50 transition-opacity"></div>
            </button>
            <button class="px-8 py-4 glass-effect rounded-full font-semibold text-lg hover:bg-white hover:bg-opacity-10 transition-all duration-300 transform hover:scale-105">
                Learn More
            </button>
        </div>
    </div>

    <!-- Scroll Indicator -->
    <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 animate-bounce">
        <svg class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
        </svg>
    </div>
</section>

</body>
</html>
